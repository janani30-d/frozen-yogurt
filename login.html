<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Froyo Bliss | Frozen Yogurt Shop</title>

  <!-- Favicon -->

  <link rel="icon" type="image/png" href="images/logo.png">

  <!-- Google Fonts -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <!-- CSS -->

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<!=========================================================
   LOGIN PAGE
   PART 1 — HTML
   NO HEADER
========================================================= !>

<section class="login-section" id="loginSection">

    <div class="login-container">


        <!-- =================================================
             TOP AUTH CONTROLS
             Logo + RTL + Dark Mode
        ================================================== -->

        <div class="login-top-bar">

            <!-- Logo -->
            <a href="index.html" class="login-logo">

                <img
                    src="images/logo.png"
                    alt="Frozen Yogurt Shop"
                >

            </a>


            <!-- Controls -->
            <div class="login-auth-controls">

                <!-- RTL -->
                <button
                    type="button"
                    class="login-auth-control"
                    id="rtlToggle"
                    aria-label="Toggle RTL mode"
                    title="Toggle RTL"
                >
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                    
                </button>


                <!-- Dark Mode -->
                <button
                    type="button"
                    class="login-auth-control"
                    id="darkModeToggle"
                    aria-label="Toggle dark mode"
                    title="Toggle Dark Mode"
                >
                    <i class="fa-solid fa-moon"></i>
                   
                </button>

            </div>

        </div>



        <!-- =================================================
             LOGIN CONTENT AREA
        ================================================== -->

        <div class="login-main">


            <!-- =================================================
                 LOGIN FORM CONTENT
            ================================================== -->

            <div class="login-content">


                <!-- Brand Mark -->
                <div class="login-brand-mark">

                    <i class="fa-solid fa-spoon"></i>

                </div>


                <!-- Eyebrow -->
                <span class="login-eyebrow">
                    WELCOME BACK
                </span>


                <!-- Heading -->
                <h1>
                    Welcome Back to
                    <span>Frozen Yogurt</span>
                </h1>


                <!-- Intro -->
                <p class="login-intro">
                    Sign in to your account and keep your favorite
                    frozen yogurt moments close.
                </p>


                <!-- =================================================
                     LOGIN FORM
                ================================================== -->

                <form
                    class="login-form"
                    id="loginForm"
                >


                    <!-- Email -->
                    <div class="login-form-group">

                        <label for="loginEmail">
                            Email Address
                        </label>

                        <div class="login-input-wrap">

                            <i class="fa-regular fa-envelope"></i>

                            <input
                                type="email"
                                id="loginEmail"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <!-- Password -->
                    <div class="login-form-group">

                        <div class="login-password-label">

                            <label for="loginPassword">
                                Password
                            </label>

                            

                        </div>


                        <div class="login-input-wrap">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="loginPassword"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="login-password-toggle"
                                id="loginPasswordToggle"
                                aria-label="Show password"
                            >
                                <i class="fa-regular fa-eye"></i>
                            </button>

                        </div>

                    </div>


                    <!-- Remember Me -->
                    <div class="login-form-options">

                        <label class="login-remember">

                            <input
                                type="checkbox"
                                id="loginRemember"
                                name="remember"
                            >

                            <span class="login-custom-checkbox"></span>

                            <span class="login-remember-text">
                                Remember me
                            </span>

                        </label>
                        <a
                                href="#"
                                class="login-forgot-link"
                            >
                                Forgot Password?
                            </a>

                    </div>


                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="login-submit"
                    >

                        <span>
                            Login to Your Account
                        </span>

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>


                    <!-- Divider -->
                    <div class="login-divider">

                        <span>
                            OR CONTINUE WITH
                        </span>

                    </div>


                    <!-- =================================================
                         SOCIAL LOGIN
                    ================================================== -->

                    <div class="login-social-buttons">


                        <!-- Google -->
                        <button
                            type="button"
                            class="login-social-button login-social-google"
                            aria-label="Continue with Google"
                        >

                            <svg
                                class="login-social-svg"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <path
                                    fill="#4285F4"
                                    d="M21.35 12.27c0-.71-.06-1.39-.18-2.04H12v3.86h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.21Z"
                                />

                                <path
                                    fill="#34A853"
                                    d="M12 21.84c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.47-4.03H3.29v2.53A9.75 9.75 0 0 0 12 21.84Z"
                                />

                                <path
                                    fill="#FBBC05"
                                    d="M6.53 13.92A5.86 5.86 0 0 1 6.23 12c0-.67.12-1.32.3-1.92V7.55H3.29A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.04 4.45l3.24-2.53Z"
                                />

                                <path
                                    fill="#EA4335"
                                    d="M12 6.05c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.14 14.63 2.16 12 2.16a9.75 9.75 0 0 0-8.71 5.39l3.24 2.53C7.3 7.77 9.46 6.05 12 6.05Z"
                                />

                            </svg>

                            <span>Google</span>

                        </button>


                        <!-- Facebook -->
                        <button
                            type="button"
                            class="login-social-button login-social-facebook"
                            aria-label="Continue with Facebook"
                        >

                            <svg
                                class="login-social-svg"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <path
                                    fill="#1877F2"
                                    d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.04 1.79-4.73 4.54-4.73 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.95.93-1.95 1.88v2.3h3.32l-.53 3.49h-2.79V24C19.61 23.1 24 18.1 24 12.07Z"
                                />

                            </svg>

                            <span>Facebook</span>

                        </button>


                        <!-- Apple -->
                        <button
                            type="button"
                            class="login-social-button login-social-apple"
                            aria-label="Continue with Apple"
                        >

                            <svg
                                class="login-social-svg"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <path
                                    fill="#000000"
                                    d="M17.05 12.54c-.02-2.18 1.78-3.23 1.86-3.28a4.1 4.1 0 0 0-3.23-1.75c-1.36-.14-2.66.81-3.35.81-.7 0-1.78-.8-2.92-.78a4.3 4.3 0 0 0-3.62 2.21c-1.56 2.7-.4 6.68 1.1 8.87.75 1.07 1.62 2.26 2.78 2.22 1.12-.05 1.54-.72 2.9-.72 1.35 0 1.73.72 2.91.7 1.2-.02 1.96-1.08 2.69-2.16a8.82 8.82 0 0 0 1.23-2.5 3.88 3.88 0 0 1-2.35-3.62Z"
                                />

                                <path
                                    fill="#000000"
                                    d="M14.85 6.08c.61-.74 1.02-1.77.91-2.8-.88.04-1.95.59-2.58 1.33-.56.65-1.05 1.69-.92 2.68.98.08 1.98-.5 2.59-1.21Z"
                                />

                            </svg>

                            <span>Apple</span>

                        </button>

                    </div>


                    <!-- Register -->
                    <p class="login-register-text">

                        Don't have an account?

                        <a href="register.html">
                            Create an Account
                        </a>

                    </p>

                </form>

            </div>



            <!-- =================================================
                 LOGIN VISUAL
            ================================================== -->

            <div class="login-visual">

                <div class="login-image">

                    <img
                        src="images/login.jpg"
                        alt="Frozen yogurt dessert"
                        loading="eager"
                    >

                </div>

                <div class="login-image-overlay"></div>


                <!-- Visual Card -->
                <div class="login-visual-card">

                    <div class="login-visual-icon">
                        <i class="fa-solid fa-heart"></i>
                    </div>

                    <div class="login-visual-card-content">

                        <span>
                            A LITTLE SWEETER
                        </span>

                        <strong>
                            Every Visit, Every Moment
                        </strong>

                        <small>
                            Your favorite flavors are waiting.
                        </small>

                    </div>

                </div>


                <!-- Flavor Badge -->
                <div class="login-flavor-badge">

                    <span class="login-flavor-dot"></span>

                    <span>
                        YOUR SWEET SPOT
                    </span>

                </div>

            </div>

        </div>

    </div>

</section>

<!-- JS -->

  <script src="js/script.js"></script>

</body>
</html>
