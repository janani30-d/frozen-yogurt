
<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquire | Pancake & Breakfast House</title>

    <link rel="icon" type="image/png" href="images/logo.png">

    <meta name="description"
          content="Get in touch with Pancake & Breakfast House. Send us your questions and enquiries.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Responsive CSS -->
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<main class="enquiry-page-wrapper" id="enquiryLayout">

    <!-- =========================================
         TOP BAR
    ========================================== -->

    <header class="enquiry-topbar">

        <!-- Logo -->
        <a href="index.html"
           class="enquiry-topbar-logo"
           aria-label="Pancake & Breakfast House home">

            <img src="images/logo.png"
                 alt="Pancake & Breakfast House">
        </a>

        <!-- RTL and Dark Mode -->
        <div class="enquiry-topbar-actions">

            <button
                    type="button"
                    class="header-control-btn rtl-toggle"
                    id="rtlToggle"
                    aria-label="Switch to RTL mode"
                    title="RTL Mode"
                >

                    <i
                        class="fa-solid fa-arrow-right-arrow-left"
                        aria-hidden="true"
                    ></i>

                </button>


                <!-- =========================================
                     DARK MODE BUTTON
                ========================================== -->

                <button
                    type="button"
                    class="header-control-btn dark-mode-toggle"
                    id="darkModeToggle"
                    aria-label="Enable dark mode"
                    title="Dark Mode"
                >

                    <i
                        class="fa-solid fa-moon"
                        aria-hidden="true"
                    ></i>

                </button>



        </div>

    </header>


    <!-- =========================================
         ENQUIRY HERO + FORM
    ========================================== -->

    <section class="enquiry-section" id="enquiryPage">

        <div class="enquiry-container">

            <!-- Heading -->
            <div class="enquiry-heading">

                <span class="enquiry-eyebrow">
                    GET IN TOUCH
                </span>

                <h1>We'd Love to Hear From You</h1>

                <p>
                    Have a question or need more information?
                    Send us your enquiry and our team will get back to you.
                </p>

            </div>


            <!-- Form Card -->
            <div class="enquiry-card">

                <div class="enquiry-card-heading">

                    <span class="enquiry-card-icon">
                        <i class="fa-regular fa-paper-plane"></i>
                    </span>

                    <div>
                        <h2>Send Us a Message</h2>

                        <p>
                            Fill out the form below and we'll be happy to help.
                        </p>
                    </div>

                </div>


                <!-- Enquiry Form -->
                <form class="enquiry-form" id="enquiryForm">

                    <div class="enquiry-form-grid">

                        <!-- Full Name -->
                        <div class="enquiry-field">

                            <label for="enquiryName">
                                Full Name <span>*</span>
                            </label>

                            <input type="text"
                                   id="enquiryName"
                                   name="name"
                                   placeholder="Enter your full name"
                                   autocomplete="name"
                                   required>

                        </div>


                        <!-- Email -->
                        <div class="enquiry-field">

                            <label for="enquiryEmail">
                                Email Address <span>*</span>
                            </label>

                            <input type="email"
                                   id="enquiryEmail"
                                   name="email"
                                   placeholder="Enter your email address"
                                   autocomplete="email"
                                   required>

                        </div>


                        <!-- Phone -->
                        <div class="enquiry-field">

                            <label for="enquiryPhone">
                                Phone Number <span>*</span>
                            </label>

                            <input type="tel"
                                   id="enquiryPhone"
                                   name="phone"
                                   placeholder="Enter your phone number"
                                   autocomplete="tel"
                                   required>

                        </div>


                        <!-- Enquiry Type -->
                        <div class="enquiry-field">

                            <label for="enquiryType">
                                Enquiry Type <span>*</span>
                            </label>

                            <select id="enquiryType"
                                    name="enquiry_type"
                                    required>

                                <option value="" disabled selected>
                                    Select enquiry type
                                </option>

                                <option value="General Enquiry">General Enquiry</option>
                                <option value="Menu Enquiry">Menu Enquiry</option>
                                <option value="Catering">Catering</option>
                                <option value="Private Events">Private Events</option>
                                <option value="Franchise">Franchise</option>
                                <option value="Feedback">Feedback</option>
                                <option value="Other">Other</option>

                            </select>

                        </div>


                        <!-- Subject -->
                        <div class="enquiry-field enquiry-field-full">

                            <label for="enquirySubject">
                                Subject <span>*</span>
                            </label>

                            <input type="text"
                                   id="enquirySubject"
                                   name="subject"
                                   placeholder="Enter enquiry subject"
                                   required>

                        </div>


                        <!-- Message -->
                        <div class="enquiry-field enquiry-field-full">

                            <label for="enquiryMessage">
                                Your Message <span>*</span>
                            </label>

                            <textarea id="enquiryMessage"
                                      name="message"
                                      rows="5"
                                      placeholder="Write your enquiry here..."
                                      required></textarea>

                        </div>

                    </div>


                    <!-- Submit -->
                    <div class="enquiry-form-bottom">

                        <p>
                            <i class="fa-solid fa-lock"></i>
                            Your information will be kept private.
                        </p>

                        <button type="submit"
                                class="enquiry-submit-btn">

                            <span>Submit Enquiry</span>

                            <i class="fa-solid fa-arrow-right"
                               aria-hidden="true"></i>

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </section>

</main>


<!-- JavaScript -->
<script src="js/script.js"></script>
<script src="js/site-settings.js"></script>

</body>
</html>
